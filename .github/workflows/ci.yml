name: CI

# ──────────────────────────────────────────
# トリガー: main ブランチへの PR 作成・更新時に起動
# ──────────────────────────────────────────
on:
  pull_request:
    branches:
      - main

jobs:
  # ──────────────────────────────────────────
  # フロントエンド: Lint
  # ESLint でコードのスタイル・品質をチェック
  # ──────────────────────────────────────────
  frontend-lint:
    name: "Frontend: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # package-lock.json の場所を指定することでキャッシュが効く
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # working-directory で「frontend/ の中で実行する」と指定
      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

  # ──────────────────────────────────────────
  # フロントエンド: 型チェック
  # TypeScript の型エラーを検出（コンパイルはしない）
  # ──────────────────────────────────────────
  frontend-type-check:
    name: "Frontend: Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run type-check
        working-directory: frontend

  # ──────────────────────────────────────────
  # フロントエンド: ビルド
  # next build が成功するかチェック
  # Lint・型チェックが両方通った場合のみ実行（needs で依存関係を定義）
  # ──────────────────────────────────────────
  frontend-build:
    name: "Frontend: Build"
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-type-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  # ──────────────────────────────────────────
  # バックエンド: セクション2（バックエンド初期化）完了後に追加予定
  # ──────────────────────────────────────────
